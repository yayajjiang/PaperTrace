name: Curation Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1,4"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit event freshness and coverage
        run: npm run events:check

      - name: Audit model lifecycle deadlines
        run: npm run models:check

      - name: Refresh and audit research sources
        run: npm run news:sync
        continue-on-error: true

      - name: Refresh open-source tool signals
        run: npm run tools:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Refresh community discovery signals
        run: npm run community:sync
        continue-on-error: true

      - name: Refresh model-provider status
        run: npm run status:sync
        continue-on-error: true

      - name: Open or update the curation inbox
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const events = JSON.parse(fs.readFileSync('public/data/event-health.json', 'utf8'));
            const news = JSON.parse(fs.readFileSync('public/data/headlines.json', 'utf8'));
            const tools = JSON.parse(fs.readFileSync('public/data/tool-signals.json', 'utf8'));
            const models = JSON.parse(fs.readFileSync('public/data/model-health.json', 'utf8'));
            const community = JSON.parse(fs.readFileSync('public/data/community-signals.json', 'utf8'));
            const providerStatus = JSON.parse(fs.readFileSync('public/data/provider-status.json', 'utf8'));
            const failedSources = (news.sources || []).filter(source => source.status !== 'ok');
            const failedTools = (tools.sources || []).filter(source => source.status !== 'ok');
            const failedCommunity = (community.sources || []).filter(source => source.status !== 'ok');
            const failedStatus = (providerStatus.sources || []).filter(source => source.status !== 'ok');
            const providerIncidents = (providerStatus.providers || []).filter(provider => provider.indicator !== 'none');
            const sections = [];
            if (events.urgent.length) sections.push(`## Deadlines within 14 days\n${events.urgent.map(item => `- [ ] \`${item.id}\` — ${item.deadlineAt}`).join('\n')}`);
            if (events.stale.length) sections.push(`## Event records not verified for 14 days\n${events.stale.map(item => `- [ ] \`${item.id}\` — last checked ${item.verifiedAt}`).join('\n')}`);
            if (events.coverageGaps.length) sections.push(`## Coverage gaps\n${events.coverageGaps.map(item => `- [ ] ${item.domain}: ${item.upcoming}/${item.target} upcoming entries`).join('\n')}`);
            if (failedSources.length) sections.push(`## Failed research sources\n${failedSources.map(item => `- [ ] ${item.name}: ${item.note || 'unavailable'}`).join('\n')}`);
            if (failedTools.length) sections.push(`## Failed repository signals\n${failedTools.map(item => `- [ ] ${item.name}: ${item.note || 'unavailable'}`).join('\n')}`);
            if (failedCommunity.length) sections.push(`## Failed community sources\n${failedCommunity.map(item => `- [ ] ${item.name}: ${item.note || 'unavailable'}`).join('\n')}`);
            if (failedStatus.length) sections.push(`## Failed provider status sources\n${failedStatus.map(item => `- [ ] ${item.name}: ${item.note || 'unavailable'}`).join('\n')}`);
            if (providerIncidents.length) sections.push(`## Active provider incidents\n${providerIncidents.map(item => `- [ ] ${item.name}: ${item.description} (${item.indicator})`).join('\n')}`);
            if (models.upcomingActions.length) sections.push(`## Model actions within 60 days\n${models.upcomingActions.map(item => `- [ ] ${item.provider} · \`${item.id}\` — ${item.actionAt} (${item.days}d, ${item.status})`).join('\n')}`);
            if (models.stale.length) sections.push(`## Model records not verified for 14 days\n${models.stale.map(item => `- [ ] \`${item.id}\` — last checked ${item.verifiedAt}`).join('\n')}`);
            if (!sections.length) return;
            const title = '[Curation] Research Radar watch';
            const body = `Automated audit at ${new Date().toISOString()}. Check canonical organizer/source pages before editing.\n\n${sections.join('\n\n')}\n\nThis issue is refreshed instead of duplicated.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
